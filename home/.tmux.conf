set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:Tc"

setw -g mouse on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

bind-key -n M-t new-window
bind-key -n M-w confirm-before -p "kill-window #W? (y/n)" kill-window
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

bind-key -n C-k confirm-before -p "clear history? (y/n)" clear-history

set-option -g status-right "%I:%M %p (#(TZ="Etc/UTC" date +'%%b %%d %%H:%%M') UTC)"

# Detect local vs remote: SSH_CONNECTION is set when in an SSH session
if-shell '[ -n "$SSH_CONNECTION" ]' {
    set -g status-style fg=white,bg=colour24
    set-option -g status-right "#h"
} {
    set -g status-style fg=white,bg=colour24
}

# Alt-Tab toggles passthrough — disables local bindings so keys reach inner tmux
bind-key -n M-Tab \
    set prefix None \;\
    set key-table off \;\
    set status-style fg=white,bg=colour237 \;\
    refresh-client -S

bind-key -T off M-Tab \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-style \;\
    refresh-client -S
